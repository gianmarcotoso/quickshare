[package]
name = "quickshare"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15.19", default-features = false, features = ["ini"] }
hex = "0.4.3"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false }
rand = { version = "0.8", features = ["std"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1.36.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
utoipa = { version = "6", features = ["axum_extras"] }
woothee = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
